name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore OpenRec-2.csproj
      - name: Build
        run: dotnet build OpenRec-2.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal
        continue-on-error: true
      - name: Publish
        run: dotnet publish OpenRec-2.csproj --configuration Release --no-build --output ./artifacts
